<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Canvas AI Quiz Solver</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #10b981;
      --primary-hover: #059669;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 22px;
      background: rgba(16, 185, 129, 0.2);
      padding: 6px;
      border-radius: 8px;
      line-height: 1;
    }
    h2 { font-size: 15px; font-weight: 700; color: #fff; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .status-badge.ready {
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
      border: 1px solid #10b981;
    }
    .status-badge.missing {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid #ef4444;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .info-list {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
    }
    .info-label { color: var(--muted); }
    .info-val { font-weight: 600; color: #e2e8f0; font-family: monospace; }
    .btn {
      width: 100%;
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
      margin-bottom: 8px;
    }
    .btn:hover { background: #475569; }
    .btn-solve {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-color: #10b981;
      color: white;
      font-size: 14px;
      font-weight: 700;
      padding: 12px;
    }
    .btn-solve:hover { opacity: 0.95; }
    .btn-link {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 11px;
      padding: 4px;
      margin-top: 4px;
      cursor: pointer;
    }
    .btn-link:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div>
      <h2>Canvas Quiz AI Solver</h2>
    </div>
  </div>

  <div id="status-badge" class="status-badge ready">
    <div class="status-dot"></div>
    <span id="status-text">กำลังโหลดสถานะ...</span>
  </div>

  <div class="info-list">
    <div class="info-row">
      <span class="info-label">โมเดล AI:</span>
      <span class="info-val" id="model-val">-</span>
    </div>
    <div class="info-row">
      <span class="info-label">โหมด:</span>
      <span class="info-val" id="mode-val">-</span>
    </div>
    <div class="info-row">
      <span class="info-label">ความลึก (Effort):</span>
      <span class="info-val" id="effort-val">-</span>
    </div>
  </div>

  <!-- Main Action Buttons -->
  <button class="btn btn-solve" id="trigger-solve-btn">
    <span>🚀</span>
    <span>ดึงข้อสอบ & วิเคราะห์ทันที</span>
  </button>

  <button class="btn" id="open-panel-btn">
    <span>⚡</span>
    <span>เปิดแถบควบคุมบนหน้าจอ</span>
  </button>

  <button class="btn" id="open-options-btn">
    <span>⚙️</span>
    <span>ตั้งค่า API Key / เปลี่ยนโมเดล</span>
  </button>

  <button class="btn-link" id="reload-tab-btn">🔄 รีโหลดหน้าเว็บนี้ใหม่</button>

  <script src="popup.js"></script>
</body>
</html>
